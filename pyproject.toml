[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "saga2d"
dynamic = ["version"]
description = "A lightweight 2D game framework: scenes, GPU rendering, UI, input, audio, saves, online rooms and packaging"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Ilya Kamenshchikov", email = "ilya.kamenshchikov@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "Pillow>=12.1.1",
    "pyglet>=2.1.13",
    "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.2"]

[project.urls]
Homepage = "https://github.com/ikamensh/saga2d-framework"
Documentation = "https://github.com/ikamensh/saga2d-framework/blob/main/README.md"
Issues = "https://github.com/ikamensh/saga2d-framework/issues"
Changelog = "https://github.com/ikamensh/saga2d-framework/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "saga2d/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["saga2d"]

[tool.pytest.ini_options]
testpaths = ["tests"]
